services:
  - type: web
    name: matchtruth-ai
    runtime: node
    plan: starter
    buildCommand: unzip -q matchtruth-ai-source.zip && npm run check
    startCommand: node server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: API_FOOTBALL_KEY
        sync: false
